# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

x-backend-prod: &backend-prod
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${API_DJANGO_SECRET_KEY:?set in .env}
  # "api" is the Host of the simulator's webhooks.
  DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?set in .env},api
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN}

x-simulator-prod: &simulator-prod
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${SIMULATOR_DJANGO_SECRET_KEY:?set in .env}
  DJANGO_ALLOWED_HOSTS: ${SIMULATOR_DOMAIN:?set in .env},provider-simulator
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${SIMULATOR_DOMAIN}

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment: *backend-prod

  worker:
    environment: *backend-prod

  beat:
    environment: *backend-prod

  provider-simulator:
    ports: !reset []
    environment: *simulator-prod

  provider-simulator-worker:
    environment: *simulator-prod

  frontend:
    ports: !reset []

  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api, frontend, provider-simulator]
