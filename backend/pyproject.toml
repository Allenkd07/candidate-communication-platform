[project]
name = "candidate-comms-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "DJ", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["config", "candidate_comms"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "drf_spectacular.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"
