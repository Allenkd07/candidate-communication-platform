worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/access.log;

    # Re-resolves containers after a restart.
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/ccp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ccp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name ccp.karthikdileep.in;
        client_max_body_size 1m;

        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            # SSE stream.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ccp-sim.karthikdileep.in;

        location / {
            set $simulator http://provider-simulator:8001;
            proxy_pass $simulator;
        }
    }
}
