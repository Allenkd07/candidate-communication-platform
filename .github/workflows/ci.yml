name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ccp
          POSTGRES_DB: ccp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ccp:ccp@127.0.0.1:5432/ccp
      REDIS_URL: redis://127.0.0.1:6379/0
      WEBHOOK_BASE_URL: http://api.test
      SIMULATOR_API_URL: http://simulator.test
      SIMULATOR_API_KEY: ci-simulator-api-key
      SIMULATOR_WEBHOOK_SECRET: ci-simulator-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest

  provider-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-simulator
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ccp
          POSTGRES_DB: simulator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ccp:ccp@127.0.0.1:5432/simulator
      REDIS_URL: redis://127.0.0.1:6379/1
      SIMULATOR_API_KEY: ci-simulator-api-key
      SIMULATOR_WEBHOOK_SECRET: ci-simulator-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, provider-simulator, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build
